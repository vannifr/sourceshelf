name: Feature request
description: Suggest a change or a new input format
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do, and what is in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Note any new dependency or change to the fiche format; both need agreement first.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
